services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playbook
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - playbook-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d playbook"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  playbook-postgres:
