<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Playbook Biosphere</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* =====================================================================
   PLAYBOOK · THEME "BIOSPHERE"
   Tokens are grouped so they can be lifted straight into a Tailwind v4
   @theme block. Light is the base; dark redefines tokens only.
   ===================================================================== */
:root {
  color-scheme: light;

  /* --- surfaces: pale mineral ------------------------------------- */
  --color-ground:     #e6eaec;
  --color-surface-1:  #f0f3f4;
  --color-surface-2:  #f8fafa;
  --color-surface-3:  #ffffff;
  --color-surface-sunk: #e4e9eb;

  /* --- structure ---------------------------------------------------- */
  --color-line:        rgba(16, 36, 44, 0.12);
  --color-line-strong: rgba(16, 36, 44, 0.22);
  --color-line-hi:     rgba(255, 255, 255, 0.85);

  /* --- ink ---------------------------------------------------------- */
  --color-text:   #11181d;
  --color-text-2: #44515a;
  --color-text-3: #5d6a72;
  --color-text-on-accent: #f4fffd;

  /* --- accent: deep teal for contrast on pale ground ---------------- */
  --color-accent:        #0a7470;
  --color-accent-strong: #085e5a;
  --color-accent-soft:   rgba(10, 116, 112, 0.10);
  --color-accent-line:   rgba(10, 116, 112, 0.42);
  --color-accent-glow:   rgba(10, 116, 112, 0.20);

  /* --- semantic (separate from accent) ------------------------------ */
  --color-warn:   #a8701a;
  --color-danger: #bd4239;
  --color-danger-soft: rgba(189, 66, 57, 0.10);

  /* --- elevation ---------------------------------------------------- */
  --shadow-raise: 0 1px 2px rgba(12, 24, 30, 0.06), 0 10px 28px -14px rgba(12, 24, 30, 0.22);
  --shadow-float: 0 2px 6px rgba(12, 24, 30, 0.08), 0 18px 44px -18px rgba(12, 24, 30, 0.35);
  --shadow-press: inset 0 1.5px 3px rgba(12, 24, 30, 0.14);
  --shadow-inset-hi: inset 0 1px 0 rgba(255, 255, 255, 0.9);

  /* --- atmosphere --------------------------------------------------- */
  --grid-ink: rgba(16, 36, 44, 0.07);

  /* --- type --------------------------------------------------------- */
  --font-sans: 'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --text-xs: 0.75rem;   /* 12 */
  --text-sm: 0.8125rem; /* 13 */
  --text-md: 0.9375rem; /* 15 */
  --text-lg: 1.0625rem; /* 17 */
  --text-xl: 1.375rem;  /* 22 */
  --text-2xl: 1.75rem;  /* 28 */
  --text-timer: 2.75rem;/* 44 */

  /* --- shape & rhythm ------------------------------------------------ */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-pill: 999px;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
  --touch: 44px;

  /* --- motion --------------------------------------------------------- */
  --ease-out: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.3, 0.64, 1);
  --dur-fast: 120ms;
  --dur: 220ms;
  --dur-slow: 380ms;
}

/* Dark: charcoal & graphite, soft white ink, controlled luminous accent */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --color-ground:     #0a0d10;
    --color-surface-1:  #11151a;
    --color-surface-2:  #171c21;
    --color-surface-3:  #1e242a;
    --color-surface-sunk: #0d1114;
    --color-line:        rgba(186, 214, 222, 0.10);
    --color-line-strong: rgba(186, 214, 222, 0.18);
    --color-line-hi:     rgba(255, 255, 255, 0.05);
    --color-text:   #e7edf0;
    --color-text-2: #98a5ad;
    --color-text-3: #7a8790;
    --color-text-on-accent: #04201e;
    --color-accent:        #46d4cb;
    --color-accent-strong: #7fe9e2;
    --color-accent-soft:   rgba(70, 212, 203, 0.12);
    --color-accent-line:   rgba(70, 212, 203, 0.42);
    --color-accent-glow:   rgba(70, 212, 203, 0.26);
    --color-warn:   #e2ab52;
    --color-danger: #e66a62;
    --color-danger-soft: rgba(230, 106, 98, 0.14);
    --shadow-raise: inset 0 1px 0 rgba(255, 255, 255, 0.045), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
    --shadow-float: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 18px 44px -16px rgba(0, 0, 0, 0.85);
    --shadow-press: inset 0 1.5px 3px rgba(0, 0, 0, 0.55);
    --shadow-inset-hi: inset 0 1px 0 rgba(255, 255, 255, 0.05);
    --grid-ink: rgba(186, 214, 222, 0.055);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --color-ground:     #0a0d10;
  --color-surface-1:  #11151a;
  --color-surface-2:  #171c21;
  --color-surface-3:  #1e242a;
  --color-surface-sunk: #0d1114;
  --color-line:        rgba(186, 214, 222, 0.10);
  --color-line-strong: rgba(186, 214, 222, 0.18);
  --color-line-hi:     rgba(255, 255, 255, 0.05);
  --color-text:   #e7edf0;
  --color-text-2: #98a5ad;
  --color-text-3: #7a8790;
  --color-text-on-accent: #04201e;
  --color-accent:        #46d4cb;
  --color-accent-strong: #7fe9e2;
  --color-accent-soft:   rgba(70, 212, 203, 0.12);
  --color-accent-line:   rgba(70, 212, 203, 0.42);
  --color-accent-glow:   rgba(70, 212, 203, 0.26);
  --color-warn:   #e2ab52;
  --color-danger: #e66a62;
  --color-danger-soft: rgba(230, 106, 98, 0.14);
  --shadow-raise: inset 0 1px 0 rgba(255, 255, 255, 0.045), 0 10px 28px -14px rgba(0, 0, 0, 0.7);
  --shadow-float: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 18px 44px -16px rgba(0, 0, 0, 0.85);
  --shadow-press: inset 0 1.5px 3px rgba(0, 0, 0, 0.55);
  --shadow-inset-hi: inset 0 1px 0 rgba(255, 255, 255, 0.05);
  --grid-ink: rgba(186, 214, 222, 0.055);
}

/* ---------------------------------------------------------------------
   Base
   --------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100dvh;
  background: var(--color-ground);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-md);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: var(--radius-sm); }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; letter-spacing: -0.01em; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Atmosphere: the habitat dome. A faint structural grid and one soft
   light source high above the content. Both sit on the ground only. */
.app {
  position: relative;
  min-height: 100dvh;
  isolation: isolate;
}
.app::before {
  content: "";
  position: fixed; inset: 0; z-index: -2;
  background:
    radial-gradient(70% 45% at 50% -8%, var(--color-accent-glow), transparent 70%),
    var(--color-ground);
}
.app::after {
  content: "";
  position: fixed; inset: 0; z-index: -1;
  background-image:
    linear-gradient(var(--grid-ink) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-ink) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.25) 45%, transparent 90%);
  -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), rgba(0,0,0,.25) 45%, transparent 90%);
  pointer-events: none;
}

/* ---------------------------------------------------------------------
   Shell: stage + bottom tab bar on phones; rail on wide screens
   --------------------------------------------------------------------- */
.stage {
  max-width: 560px;
  margin: 0 auto;
  padding: env(safe-area-inset-top) var(--space-4) calc(88px + env(safe-area-inset-bottom));
  min-height: 100dvh;
}
.stage.has-dock { padding-bottom: calc(132px + env(safe-area-inset-bottom)); }

.rail { display: none; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(3, 1fr);
  padding: 6px var(--space-3) calc(6px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--color-surface-1) 82%, transparent);
  -webkit-backdrop-filter: blur(18px) saturate(1.2);
  backdrop-filter: blur(18px) saturate(1.2);
  border-top: 1px solid var(--color-line);
}
.tab {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-height: 52px; padding: 6px 4px 4px; border-radius: var(--radius-md);
  color: var(--color-text-3); font-size: var(--text-xs); font-weight: 500; letter-spacing: 0.01em;
  transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
}
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--color-accent); }
.tab:active { background: var(--color-accent-soft); }
.tabbar.is-hidden { display: none; }

@media (min-width: 900px) {
  .tabbar { display: none; }
  .rail {
    display: flex; flex-direction: column; gap: var(--space-2);
    position: fixed; top: 0; bottom: 0; left: 0; width: 232px; z-index: 30;
    padding: var(--space-6) var(--space-4);
    border-right: 1px solid var(--color-line);
    background: color-mix(in srgb, var(--color-surface-1) 70%, transparent);
    -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  }
  .rail .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 18px; font-weight: 600; letter-spacing: -0.01em; }
  .rail .brand .mark { width: 22px; height: 22px; }
  .rail .tab {
    flex-direction: row; justify-content: flex-start; gap: 10px;
    min-height: var(--touch); padding: 0 10px; font-size: var(--text-md);
    color: var(--color-text-2);
  }
  .rail .tab svg { width: 18px; height: 18px; }
  .rail .tab:hover { background: var(--color-surface-2); color: var(--color-text); }
  .rail .tab[aria-current="page"] { background: var(--color-accent-soft); color: var(--color-accent); }
  .rail .rail-foot { margin-top: auto; padding: 10px; color: var(--color-text-3); font-size: var(--text-xs); }
  .stage { margin-left: 232px; max-width: none; padding: var(--space-10) var(--space-10) var(--space-10); }
  .stage > .page { max-width: 640px; margin: 0 auto; }
  .stage.has-dock { padding-bottom: 140px; }
}

/* Brand mark: a sealed ring with a living pulse inside */
.mark { display: inline-block; width: 20px; height: 20px; }

/* ---------------------------------------------------------------------
   Type roles
   --------------------------------------------------------------------- */
.eyebrow {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500;
  letter-spacing: 0.12em; text-transform: uppercase; color: var(--color-text-3);
  display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--color-accent); box-shadow: 0 0 0 3px var(--color-accent-soft); }
.eyebrow.is-live { color: var(--color-accent); }
.title-xl { font-size: var(--text-2xl); font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
.title-lg { font-size: var(--text-xl); font-weight: 600; line-height: 1.2; letter-spacing: -0.015em; }
.title-md { font-size: var(--text-lg); font-weight: 600; line-height: 1.3; }
.muted { color: var(--color-text-2); }
.faint { color: var(--color-text-3); }
.small { font-size: var(--text-sm); }

/* ---------------------------------------------------------------------
   Controls. Subtle depth; pressed states sink.
   --------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: var(--touch); padding: 0 18px;
  border-radius: var(--radius-md);
  font-size: var(--text-md); font-weight: 600; letter-spacing: -0.005em; line-height: 1;
  border: 1px solid var(--color-line-strong);
  background: linear-gradient(to bottom, var(--color-surface-3), var(--color-surface-2));
  color: var(--color-text);
  box-shadow: var(--shadow-inset-hi), 0 1px 2px rgba(0,0,0,.08);
  transition: transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast), color var(--dur-fast);
  white-space: nowrap;
}
.btn svg { width: 18px; height: 18px; flex: none; }
.btn:hover { border-color: var(--color-line-strong); background: var(--color-surface-3); }
.btn:active, .btn.is-pressed { transform: translateY(1px); box-shadow: var(--shadow-press); }
.btn.primary {
  border-color: transparent;
  background: linear-gradient(to bottom, color-mix(in srgb, var(--color-accent) 90%, white), color-mix(in srgb, var(--color-accent) 92%, black));
  color: var(--color-text-on-accent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 1px 2px rgba(0,0,0,.18), 0 8px 20px -10px var(--color-accent-glow);
}
.btn.primary:hover { filter: brightness(1.04); }
.btn.primary:active { transform: translateY(1px); box-shadow: inset 0 2px 4px rgba(0,0,0,.25); filter: none; }
.btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--color-text-2); }
.btn.ghost:hover { background: var(--color-surface-2); color: var(--color-text); }
.btn.ghost:active { background: var(--color-surface-sunk); box-shadow: none; transform: none; }
.btn.danger { color: var(--color-danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: var(--text-sm); border-radius: var(--radius-sm); }
.btn.sm svg { width: 16px; height: 16px; }
.btn.block { width: 100%; }
.btn.icon { padding: 0; width: var(--touch); }
.btn.icon.sm { width: 36px; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* segmented control */
.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px;
  padding: 3px; border-radius: var(--radius-md);
  background: var(--color-surface-sunk); border: 1px solid var(--color-line);
  box-shadow: var(--shadow-press);
}
.seg > button {
  min-height: 38px; border-radius: 7px; font-size: var(--text-sm); font-weight: 500; color: var(--color-text-2);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: background var(--dur-fast), color var(--dur-fast), box-shadow var(--dur-fast);
}
.seg > button svg { width: 15px; height: 15px; }
.seg > button[aria-pressed="true"] {
  background: var(--color-surface-3); color: var(--color-text);
  box-shadow: var(--shadow-inset-hi), 0 1px 2px rgba(0,0,0,.12);
}

/* chips (category filter) */
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; margin: 0 calc(-1 * var(--space-4)); padding-inline: var(--space-4); }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 34px; padding: 0 12px; border-radius: var(--radius-pill);
  border: 1px solid var(--color-line); background: var(--color-surface-1);
  font-size: var(--text-sm); font-weight: 500; color: var(--color-text-2);
  transition: background var(--dur-fast), color var(--dur-fast), border-color var(--dur-fast);
}
.chip[aria-pressed="true"] { background: var(--color-accent-soft); border-color: var(--color-accent-line); color: var(--color-accent); }
.chip:active { transform: translateY(1px); }
@media (min-width: 900px) { .chips { margin: 0; padding-inline: 0; } }

/* ---------------------------------------------------------------------
   Surfaces
   --------------------------------------------------------------------- */
.panel {
  background: var(--color-surface-2);
  border: 1px solid var(--color-line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-raise);
}
.panel.raised { background: var(--color-surface-3); box-shadow: var(--shadow-float); }

/* Page header */
.page { display: flex; flex-direction: column; gap: var(--space-6); padding-top: var(--space-5); }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
.page-head .stack { display: flex; flex-direction: column; gap: 6px; }

/* ---------------------------------------------------------------------
   Library
   --------------------------------------------------------------------- */
.resume-card {
  position: relative; overflow: hidden;
  padding: var(--space-5);
  display: grid; gap: var(--space-4);
  border-color: var(--color-accent-line);
}
.resume-card::before {
  /* the living signal: a faint bio-luminescent wash from the top-left */
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(80% 60% at 0% 0%, var(--color-accent-soft), transparent 70%);
}
.resume-card > * { position: relative; }
.resume-card .meta { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.resume-card .next { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-md); background: var(--color-surface-1); border: 1px solid var(--color-line); font-size: var(--text-sm); }
.resume-card .next .k { color: var(--color-text-3); }
.resume-card .next .v { font-weight: 500; }
.resume-card .next .t { margin-left: auto; color: var(--color-text-2); }

.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.section-head h2 { font-size: var(--text-sm); font-weight: 600; color: var(--color-text-2); letter-spacing: 0.02em; }

.routine-list { display: grid; gap: 10px; }
.routine-row {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 14px;
  padding: 14px 14px 14px 12px;
  text-align: left; width: 100%;
  transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast), border-color var(--dur-fast);
}
.routine-row:hover { background: var(--color-surface-3); border-color: var(--color-line-strong); }
.routine-row:active { transform: scale(0.99); }
.routine-row .glyph {
  width: 44px; height: 44px; border-radius: 12px;
  display: grid; place-items: center;
  background: var(--color-surface-1); border: 1px solid var(--color-line);
  color: var(--color-text-2);
}
.routine-row .glyph svg { width: 22px; height: 22px; }
.routine-row.is-active .glyph { color: var(--color-accent); border-color: var(--color-accent-line); background: var(--color-accent-soft); }
.routine-row .body { display: grid; gap: 3px; min-width: 0; }
.routine-row .body .t { font-weight: 600; font-size: var(--text-md); overflow-wrap: anywhere; }
.routine-row .body .s { font-size: var(--text-sm); color: var(--color-text-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.routine-row .body .s b { font-weight: 500; color: var(--color-text-2); }
.routine-row .body .s .sep { opacity: .5; }
.routine-row .cta { display: flex; align-items: center; gap: 8px; }
.mini-bar { display: inline-flex; gap: 2px; }
.mini-bar i { width: 8px; height: 4px; border-radius: 2px; background: var(--color-line-strong); }
.mini-bar i.done { background: var(--color-accent); }

/* ---------------------------------------------------------------------
   Progress: segmented
   --------------------------------------------------------------------- */
.progress { display: grid; gap: 8px; }
.progress .row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.progress .count { font-family: var(--font-mono); font-size: var(--text-sm); font-weight: 500; color: var(--color-text-2); }
.progress .count b { color: var(--color-text); font-weight: 600; }
.segments { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.segments i {
  display: block; height: 6px; border-radius: 3px;
  background: var(--color-surface-sunk);
  box-shadow: inset 0 0 0 1px var(--color-line);
  transition: background var(--dur) var(--ease-out), box-shadow var(--dur) var(--ease-out);
}
.segments i.done { background: var(--color-accent); box-shadow: none; }
.segments i.current {
  background: linear-gradient(90deg, var(--color-accent) 0 var(--fill, 0%), transparent var(--fill, 0%));
  box-shadow: inset 0 0 0 1px var(--color-accent-line), 0 0 10px -2px var(--color-accent-glow);
  animation: seg-breathe 2.4s var(--ease-out) infinite;
}
@keyframes seg-breathe { 0%,100% { box-shadow: inset 0 0 0 1px var(--color-accent-line), 0 0 8px -3px var(--color-accent-glow); } 50% { box-shadow: inset 0 0 0 1px var(--color-accent), 0 0 12px -1px var(--color-accent-glow); } }

/* ---------------------------------------------------------------------
   Run screen
   --------------------------------------------------------------------- */
.run-head {
  position: sticky; top: 0; z-index: 20;
  margin: 0 calc(-1 * var(--space-4)); padding: calc(10px + env(safe-area-inset-top)) var(--space-4) 12px;
  background: color-mix(in srgb, var(--color-ground) 84%, transparent);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--color-line);
  display: grid; gap: 10px;
}
@media (min-width: 900px) { .run-head { margin: 0; padding: 8px 0 14px; top: 0; } }
.run-head .bar { display: flex; align-items: center; gap: 8px; }

}

  content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px; border-radius: 2px;
  background: var(--color-accent); box-shadow: 0 0 10px var(--color-accent-glow);
}

.step-row {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 12px;

.check {
  width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--color-line-strong);

  transition: background var(--dur) var(--ease-spring), border-color var(--dur), color var(--dur), transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur);

/* expandable body: grid rows animate height without measurement */

.timer {

  padding: 12px; border-radius: var(--radius-md);
  background: var(--color-surface-sunk); border: 1px solid var(--color-line);
  box-shadow: var(--shadow-press);

.timer .ctl { display: grid; gap: 8px; }

@media (max-width: 479px) {

  .timer .ctl { justify-items: center; }

  .ring { width: 124px; height: 124px; }
  .ring .readout { font-size: 30px; }

/* action dock */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  padding: 12px var(--space-4) calc(14px + env(safe-area-inset-bottom));

   --------------------------------------------------------------------- */

.done-card > * { position: relative; }
.done-ring { width: 128px; height: 128px; position: relative; }

.done-ring .track { fill: none; stroke: var(--color-line-strong); stroke-width: 3; }

.recap { display: grid; gap: 6px; }

   --------------------------------------------------------------------- */

.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }

.edit-row .body { display: grid; gap: 2px; min-width: 0; }

.edit-row .body .s { font-size: var(--text-sm); color: var(--color-text-3); }

/* toast */
.toast {
  position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 8px); z-index: 40;

.toast svg { width: 16px; height: 16px; color: var(--color-accent); }

/* prototype chip (design review only) */
.proto {
  position: fixed; right: 10px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 50;
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px; border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--color-surface-3) 80%, transparent); border: 1px solid var(--color-line-strong);
  box-shadow: var(--shadow-float); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);

.proto .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--color-text-3); padding: 0 6px 0 8px; }

.stage.has-dock ~ .proto, .proto.over-dock { bottom: calc(112px + env(safe-area-inset-bottom)); }
@media (min-width: 900px) { .proto { bottom: 16px; right: 16px; } .stage.has-dock ~ .proto, .proto.over-dock { bottom: 112px; } }

/* screen transitions */
.page { animation: page-in var(--dur-slow) var(--ease-out) both; }
@keyframes page-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
}

<script>

    Array.from({ length: n }, (_, i) => {

/* =====================================================================
   Run
   ===================================================================== */
function ensureRun(id) {
  if (!state.runs[id] || state.runs[id].finishedAt) {
    if (state.runs[id]?.finishedAt) return state.runs[id];

function timerState(run, i, step) {

}
function ringSvg(r = 44, cls = 'ring') {
  const c = 2 * Math.PI * r;
  const ticks = Array.from({ length: 12 }, (_, k) => { const a = (k / 12) * Math.PI * 2; const x1 = 50 + Math.cos(a) * (r - 6), y1 = 50 + Math.sin(a) * (r - 6), x2 = 50 + Math.cos(a) * (r - 8.5), y2 = 50 + Math.sin(a) * (r - 8.5); return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }).join('');
  return { c, svg: `<svg viewBox="0 0 100 100"><g class="ticks">${ticks}</g><circle class="track" cx="50" cy="50" r="${r}"/><circle class="arc" cx="50" cy="50" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="0"/></svg>` };

function renderComplete(r, run) {

        <div class="stat"><span class="v">${n} / ${n}</span><span class="k">Steps</span></div>
        <div class="stat"><span class="v">${elapsed(run)}</span><span class="k">Elapsed</span></div>
        <div class="stat"><span class="v">${HISTORY.filter((h) => h.routine === r.id && h.status === 'completed').length + 1}</span><span class="k">Total runs</span></div>
      </div>
      <div class="done-actions">
        <button class="btn primary" data-go="library">Done</button>
        <button class="btn" data-restart="${r.id}">${I.reset}Start again</button>
      </div>
    </section>
    <section style="display:grid;gap:10px">
      <div class="section-head"><h2>What you did</h2><span class="small faint mono">${n} steps</span></div>
      <div class="recap">${r.steps.map((s, i) => `<div class="recap-row"><span class="ck">${I.check}</span><span>${esc(s.title)}${s.qty ? ` <span class="faint">· ${esc(s.qty)}</span>` : ''}</span><span class="at">${run.steps[i].doneAt || ''}</span></div>`).join('')}</div>
    </section>
  </div>`;
}
</script>
<script>
/* =====================================================================
   History, settings, editor
   ===================================================================== */
function renderHistory() {
  const groups = [];
  for (const h of HISTORY) { const day = h.when.split(' · ')[0]; let g = groups.find((x) => x.day === day); if (!g) groups.push((g = { day, items: [] })); g.items.push(h); }
  const total = HISTORY.filter((h) => h.status === 'completed').length;
  return `<div class="page">
    <header class="page-head"><div class="stack"><span class="eyebrow">Last 7 days · ${total} completed</span><h1 class="title-xl">History</h1></div></header>
    <div class="stats">
      <div class="stat"><span class="v">${total}</span><span class="k">Runs</span></div>
      <div class="stat"><span class="v">1h 42m</span><span class="k">Time</span></div>
      <div class="stat"><span class="v">4</span><span class="k">Day streak</span></div>
    </div>
    ${groups.map((g) => `<section style="display:grid;gap:8px"><div class="day-label">${esc(g.day)}</div><div class="list">${g.items.map((h) => { const r = byId(h.routine); return `<button class="panel list-row"><span><span class="t">${esc(r.title)}</span><span class="s" style="display:block">${esc(r.category)} · ${esc(h.when.split(' · ')[1])} · ${h.steps} steps</span></span><span class="r">${h.status === 'completed' ? `<span class="mono">${h.dur}</span>` : `<span class="badge off">Discarded</span>`}</span></button>`; }).join('')}</div></section>`).join('')}
  </div>`;
}
function renderSettings() {
  const opt = (v, ic, l) => `<button data-theme-set="${v}" aria-pressed="${state.theme === v}">${ic}${l}</button>`;
  return `<div class="page">
    <header class="page-head"><div class="stack"><span class="eyebrow">Private · one owner</span><h1 class="title-xl">Settings</h1></div></header>
    <section class="setting-group">
      <div class="section-head"><h2>Appearance</h2></div>
      <div class="panel setting">
        <div class="head"><div><div class="t">Theme</div><div class="s">Biosphere · the only theme for now. More can be added later.</div></div></div>
        <div class="seg" role="group" aria-label="Appearance">${opt('light', I.sun, 'Light')}${opt('dark', I.moon, 'Dark')}${opt('system', I.monitor, 'System')}</div>
        <div class="swatches" aria-hidden="true">
          <span class="swatch" style="background:var(--color-ground)"></span>
          <span class="swatch" style="background:var(--color-surface-1)"></span>
          <span class="swatch" style="background:var(--color-surface-2)"></span>
          <span class="swatch" style="background:var(--color-surface-3)"></span>
          <span class="swatch" style="background:var(--color-accent)"></span>
          <span class="swatch" style="background:var(--color-text)"></span>
        </div>
      </div>
      <div class="panel setting">
        <div class="head"><div><div class="t">Reduce motion</div><div class="s">Follows your device setting. Turn on to remove transitions here too.</div></div><button class="switch" role="switch" aria-checked="${state.reduceMotion}" data-toggle="reduceMotion" aria-label="Reduce motion"></button></div>
      </div>
    </section>
    <section class="setting-group">
      <div class="section-head"><h2>Timers</h2></div>
      <div class="panel setting">
        <div class="head"><div><div class="t">Keep screen awake during a routine</div><div class="s">Uses the wake lock while a timer runs.</div></div><button class="switch" role="switch" aria-checked="true" aria-label="Keep screen awake"></button></div>
      </div>
      <div class="panel setting">
        <div class="head"><div><div class="t">Sound when a timer ends</div><div class="s">A single soft tone. Completion is still yours to check.</div></div><button class="switch" role="switch" aria-checked="true" aria-label="Timer sound"></button></div>
      </div>
    </section>
    <section class="setting-group">
      <div class="section-head"><h2>Account</h2></div>
      <div class="panel setting">
        <div class="field"><label for="pw1">Current password</label><input class="input" id="pw1" type="password" value="••••••••••••" readonly></div>
        <div class="field"><label for="pw2">New password</label><input class="input" id="pw2" type="password" placeholder="At least 12 characters"></div>
        <div style="display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap"><button class="btn">Change password</button></div>
        <p class="small faint">Changing it signs out every other device.</p>
      </div>
      <div class="panel setting"><div class="head"><div><div class="t">Sign out</div><div class="s">Signed in since 3 Sep on this phone.</div></div><button class="btn sm ghost danger">Sign out</button></div></div>
    </section>
  </div>`;
}
function renderEdit() {
  const r = state.runId === 'new' ? null : byId(state.runId);
  const steps = r ? r.steps : [];
  return `<div class="page">
    <header class="page-head">
      <button class="btn ghost icon" data-go="library" aria-label="Back">${I.chevL}</button>
      <div class="stack" style="flex:1"><span class="eyebrow">${r ? 'Edit routine' : 'New routine'}</span><h1 class="title-lg">${r ? esc(r.title) : 'Untitled routine'}</h1></div>
      <button class="btn primary sm" data-go="library" data-save>Save</button>
    </header>
    <section class="panel setting">
      <div class="field"><label for="rt">Title</label><input class="input" id="rt" value="${r ? esc(r.title) : ''}" placeholder="Morning mobility"></div>
      <div class="field"><label for="rc">Category</label><input class="input" id="rc" value="${r ? esc(r.category) : ''}" placeholder="Mobility, Workout, Baby care, Maintenance…"></div>
      <div class="field"><label for="rd">Description</label><textarea class="input" id="rd" rows="2" placeholder="What is this routine for?" style="padding:10px 12px;resize:vertical;min-height:64px">${r ? esc(r.description) : ''}</textarea></div>
    </section>
    <section style="display:grid;gap:8px">
      <div class="section-head"><h2>Steps</h2><span class="small faint mono">${steps.length}</span></div>
      ${steps.map((s, i) => `<div class="panel edit-row"><span class="grip" aria-hidden="true">${I.grip}</span><span class="body"><span class="t">${esc(s.title)}</span><span class="s">${[s.qty, s.duration ? fmt(s.duration) + ' timer' : '', s.ref ? 'link' : ''].filter(Boolean).join(' · ') || 'No label'}</span></span><button class="btn ghost icon sm" aria-label="Edit step">${I.edit}</button></div>`).join('')}
      <button class="dashed">${I.plus}Add step</button>
    </section>
    ${r ? `<button class="btn ghost danger" style="justify-self:start">Archive routine</button>` : ''}
  </div>`;
}

/* =====================================================================
   Render & events
   ===================================================================== */
function render() {
  const stage = document.getElementById('stage');
  const html = { library: renderLibrary, run: renderRun, history: renderHistory, settings: renderSettings, edit: renderEdit }[state.screen]();
  stage.innerHTML = html;
  stage.classList.toggle('has-dock', state.screen === 'run' && !state.runs[state.runId]?.finishedAt);
  renderNav();
  paintSave();
  document.documentElement.style.setProperty('--dur', state.reduceMotion ? '0ms' : '');
}

document.addEventListener('click', (e) => {
  const el = (sel) => e.target.closest(sel);
  let t;
  if ((t = el('[data-theme-set]'))) return setTheme(t.dataset.themeSet);
  if ((t = el('[data-filter]'))) { state.filter = t.dataset.filter; return render(); }
  if ((t = el('[data-restart]'))) { delete state.runs[t.dataset.restart]; markSaving(); return go('run', t.dataset.restart); }
  if ((t = el('[data-run]'))) return go('run', t.dataset.run);
  if ((t = el('[data-go]'))) {
    if (t.dataset.save !== undefined) toast('Routine saved');
    return go(t.dataset.go, t.dataset.edit || null);
  }
  if ((t = el('[data-toggle]'))) { state[t.dataset.toggle] = !state[t.dataset.toggle]; if (state.reduceMotion) document.documentElement.style.setProperty('--dur-slow', '0ms'); else document.documentElement.style.removeProperty('--dur-slow'); return render(); }
  if (state.screen !== 'run') return;
  const r = byId(state.runId); const run = state.runs[r.id];
  if ((t = el('[data-check]'))) {
    const i = +t.dataset.check; const st = run.steps[i];
    st.done = !st.done; st.doneAt = st.done ? clock() : undefined;
    if (st.done) {
      // pause a running timer for the checked step; advance to the next unchecked step
      if (run.timers[i]?.running) { const ts = timerState(run, i, r.steps[i]); run.timers[i] = { remaining: ts.remaining, running: false, startedAt: null }; }
      const next = run.steps.findIndex((s, k) => !s.done && k > i);
      run.current = next >= 0 ? next : run.steps.findIndex((s) => !s.done) >= 0 ? run.steps.findIndex((s) => !s.done) : i;
    } else { run.current = i; }
    markSaving(); render();
    const ck = document.querySelector(`[data-check="${i}"].check`); if (ck && st.done) ck.classList.add('just-done');
    return;
  }
  if ((t = el('[data-focus]'))) { run.current = +t.dataset.focus; return render(); }
  if ((t = el('[data-next]'))) { const next = run.steps.findIndex((s) => !s.done); if (next >= 0) run.current = next; return render(); }
  if ((t = el('[data-discard]'))) { delete state.runs[r.id]; markSaving(); toast('Run discarded'); return go('library'); }
  if ((t = el('[data-finish]'))) { run.finishedAt = now(); markSaving(); toast('Saved to history'); return render(); }
  if ((t = el('[data-t]'))) {
    const i = +t.dataset.i; const step = r.steps[i]; const ts = timerState(run, i, step);
    if (t.dataset.t === 'start') run.timers[i] = { remaining: ts.remaining, running: true, startedAt: now() };
    if (t.dataset.t === 'pause') run.timers[i] = { remaining: ts.remaining, running: false, startedAt: null };
    if (t.dataset.t === 'reset') run.timers[i] = { remaining: step.duration, running: false, startedAt: null };
    markSaving(); return render();
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('[role="button"][data-run]')) e.target.click();
});

/* Ticking: readouts, ring arcs, elapsed. Re-render only when a timer ends. */
setInterval(() => {
  if (state.screen !== 'run') return;
  const r = byId(state.runId); const run = state.runs[r.id]; if (!run || run.finishedAt) return;
  const el = document.getElementById('elapsed'); if (el) el.textContent = elapsed(run);
  let ended = false;
  document.querySelectorAll('.timer[data-timer]').forEach((box) => {
    const i = +box.dataset.timer; const step = r.steps[i]; const ts = timerState(run, i, step);
    if (!ts.running) return;
    box.querySelector('[data-readout]').textContent = fmt(ts.remaining);
    const arc = box.querySelector('.arc'); const c = 2 * Math.PI * 44;
    arc.style.strokeDashoffset = (c * (1 - ts.remaining / step.duration)).toFixed(1);
    const seg = document.querySelector('.segments i.current'); if (seg && i === run.current) seg.style.setProperty('--fill', Math.round((1 - ts.remaining / step.duration) * 100) + '%');
    if (ts.isDone) { run.timers[i] = { remaining: 0, running: false, startedAt: null }; ended = true; }
  });
  if (ended) { render(); toast('Timer complete', I.clock); }
}, 250);

/* Deep links for review: ?screen=run&run=morning&theme=light&state=complete|all|running|fresh */
(() => {
  const q = new URLSearchParams(location.search);
  if (q.get('theme')) { state.theme = q.get('theme'); }
  if (q.get('proto') === '0') document.getElementById('proto').hidden = true;
  if (q.get('filter')) state.filter = q.get('filter');
  const id = q.get('run') || 'morning';
  const st = q.get('state');
  if (st === 'fresh') delete state.runs[id];
  if (st === 'all' || st === 'complete') { const run = ensureRun(id); run.steps.forEach((s, i) => { s.done = true; s.doneAt = s.doneAt || `06:${pad2(33 + i * 2)}`; }); run.current = run.steps.length - 1; if (st === 'complete') run.finishedAt = now(); }
  if (st === 'running') { const run = ensureRun(id); const i = run.current; run.timers[i] = { remaining: byId(id).steps[i].duration, running: true, startedAt: now() - 12000 }; }
  if (q.get('screen')) { state.screen = q.get('screen'); state.runId = q.get('screen') === 'run' || q.get('screen') === 'edit' ? id : null; }
})();
applyTheme();
render();
</script>

</body>
</html>
